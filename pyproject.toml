[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "codex-task-runner"
version = "0.2.0"
description = "Process Codex task JSON, create/merge PRs via gh."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "sandover"}]
dependencies = [
    "playwright>=1.40",
    "requests>=2.33.0",
    "PyQt6>=6.6",
    "PyQt6-WebEngine>=6.6",
    "flask>=3.1.3",
]

[project.scripts]
codex-task-runner = "codex_task_runner.cli:main"

[tool.poetry]
packages = [{include = "codex_task_runner", from = "src"}]

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
mypy = "^1.8"

[tool.mypy]
python_version = "3.11"
strict = true
